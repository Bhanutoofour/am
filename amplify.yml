version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - |
          env | grep -E '^(NEON_DATABASE_URL|DATABASE_URL|NEXT_PUBLIC_|USER_NAME|ADMIN_PASSWORD|S3_BUCKET|S3_REGION|S3_ACCESS_KEY_ID|S3_SECRET_ACCESS_KEY|S3_PUBLIC_URL|AWS_ACCESS_KEY_ID|AWS_SECRET_ACCESS_KEY|AWS_S3_BUCKET|AWS_S3_REGION|AWS_S3_PUBLIC_URL|ZOHO_XNQSJSDP|ZOHO_XMIWTLD)=' >> .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
